<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- One sans-serif typeface for the whole website: Inter, with clean sans-serif fallbacks if the font cannot load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <style id="cr-font">
      :root {
        --cr-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
      }
      html, body {
        margin: 0;
        font-family: var(--cr-sans);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        -webkit-text-size-adjust: 100%;
      }
      /* react-native-web gives every Text / TextInput its own system font, so the typeface is set on every element here.
         The only elements left alone are the icon glyphs, which carry their own inline font-family (Ionicons and the like). */
      #root *:not([style*="font-family"]) {
        font-family: var(--cr-sans);
      }
      /* Prices, lots and times line up in neat columns. */
      #root { font-variant-numeric: tabular-nums; }
      ::selection { background: rgba(37, 99, 235, 0.22); }
    </style>

    <style id="cr-mobile">
      /* Phone and tablet browsers: real viewport height (iOS Safari address bar), notch / home-bar safe areas, no sideways scroll,
         no pull-to-refresh bounce, no 300 ms tap delay, and no zoom-in when a field is focused (iOS zooms any field under 16 px). */
      html, body { height: 100%; max-width: 100%; overflow-x: hidden; overscroll-behavior: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
      @supports (height: 100dvh) { html, body, #root { height: 100dvh; } }
      #root { box-sizing: border-box; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
      img, svg, video, canvas { max-width: 100%; }
      @media (max-width: 1024px) {
        input, textarea, select { font-size: 16px !important; }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
