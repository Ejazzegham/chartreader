[build]
  command = "npx expo export --platform web"
  publish = "dist"

# Account emails go through the Netlify function below (see WEB.md). The API itself is the Cloudflare Worker, called directly.
[[redirects]]
  from = "/mailer"
  to = "https://genuine-pika-2ac700.netlify.app/.netlify/functions/auth-mail"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
